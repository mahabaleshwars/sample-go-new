name: setup-go documentation
on:
  workflow_dispatch:
  
jobs:
  test-go:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
        go-version: [1.23.x, 1.* , <1.24.0, ~1.23.0, ^1.23.0]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go version
