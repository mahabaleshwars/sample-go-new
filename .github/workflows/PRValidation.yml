name: PR Validation

on:
  workflow_dispatch:

jobs:
  basic-validation:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses:  actions/checkout@v5

      - name: Setup Go (specific version)
        uses: actions/setup-go@v6
        with:
          go-version: '1.16. 1'

      - name: Print Go version
        run: go version

      - name: Basic Build & Test
        run: |
          go build ./...
          go test ./... 

  matrix-go-version: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:  [ '1.18', '1.19', '1.20' ]
    name: Test on Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go (matrix & semver)
        uses: actions/setup-go@v6
        with:
          go-version:  ${{ matrix.go }}
      - run: go version
      - run: go test ./...

  semver-range-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with semver range (^1.13.1)
        uses: actions/setup-go@v6
        with: 
          go-version: '^1.13.1'
      - run: go version

  semver-gte-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with semver range (>=1.17.0)
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.17.0'
      - run: go version

  prerelease-rc: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with pre-release RC version
        uses: actions/setup-go@v6
        with: 
          go-version: '1.18.0-rc.1'
      - run: go version

  prerelease-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with pre-release Beta version
        uses: actions/setup-go@v6
        with:
          go-version: '1.16.0-beta.1'
      - run: go version

  stable-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with stable alias
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - run:  go version

  oldstable-alias:
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v5
      - name: Setup Go with oldstable alias
        uses: actions/setup-go@v6
        with:
          go-version: 'oldstable'
      - run: go version

  setup-from-gomod:
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v5
      - name: Setup Go from go.mod file
        uses: actions/setup-go@v6
        with: 
          go-version-file: 'go.mod'
      - run: go version

  setup-from-toolversions:
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v5
      - name: Setup Go from . tool-versions file
        uses: actions/setup-go@v6
        with: 
          go-version-file: '.tool-versions'
      - run: go version

  setup-from-gowork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go from go.work file
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.work'
      - run: go version

  caching-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with default caching enabled
        uses: actions/setup-go@v6
        with: 
          go-version: '1.20'
      - name: Download Go modules
        run: go mod download
      - name: Build with cached modules
        run: go build ./...

  monorepo-caching:
    runs-on: ubuntu-latest
    steps:
      - uses:  actions/checkout@v5
      - name: Setup Go with monorepo cache paths
        uses: actions/setup-go@v6
        with: 
          go-version: '1.20'
          cache-dependency-path: |
            subdir/go.sum
            tools/go.sum
      - name: Download Go modules from multiple paths
        run: |
          cd subdir && go mod download
          cd ../tools && go mod download

  caching-glob-pattern:
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v5
      - name: Setup Go with glob pattern for cache
        uses: actions/setup-go@v6
        with: 
          go-version: '1.20'
          cache-dependency-path: '**/*.sum'
      - run: go mod download

  check-latest-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go and check for latest version
        uses: actions/setup-go@v6
        with:
          go-version:  '1.21'
          check-latest: true
      - run: go version

  check-latest-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with check-latest disabled (default)
        uses: actions/setup-go@v6
        with:
          go-version:  '1.20'
          check-latest: false
      - run: go version

  version-from-gomod-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with specific patch from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go version

  version-from-gomod-minor-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with minor version only (auto-detect latest patch)
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go version

  rate-limit-token:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    steps:
      - uses:  actions/checkout@v5
      - name: Setup Go with GitHub. com token for rate-limit bypass
        uses: actions/setup-go@v6
        with:
          token: ${{ secrets.GH_DOTCOM_TOKEN }}
          go-version: '1.22'
      - run: go version

  yaml-version-string-best-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go with properly quoted version string
        uses: actions/setup-go@v6
        with:
          go-version: '1.20'  # Quoted to avoid YAML parsing issues
      - run:  go version

  combined-goversion-and-file: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go (go-version takes precedence over go-version-file)
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          go-version-file: 'go.mod'
      - run: go version
