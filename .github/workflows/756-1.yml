name: Test Caching for Go < 1.10

on:
  workflow_dispatch:

jobs:
  test-legacy-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.9 (without built-in cache)
        uses: actions/setup-go@v6
        with:
          go-version: '1.9'
          cache: false  # Built-in cache won't work anyway for < 1.10

      - name: Verify Go version
        run: go version

      - name: Show Go environment
        id: go-env
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_OUTPUT
          # These will be empty for Go < 1.10
          echo "GOMODCACHE=$(go env GOMODCACHE || echo '')" >> $GITHUB_OUTPUT
          echo "GOCACHE=$(go env GOCACHE || echo '')" >> $GITHUB_OUTPUT

      - name: Debug - Show cache paths
        run: |
          echo "GOPATH: ${{ steps.go-env.outputs.GOPATH }}"
          echo "GOMODCACHE: ${{ steps.go-env.outputs.GOMODCACHE }}"
          echo "GOCACHE: ${{ steps.go-env.outputs.GOCACHE }}"

      # For Go < 1.10, cache GOPATH instead (no modules support)
      - name: Restore Go cache (GOPATH)
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-env.outputs.GOPATH }}
          key: go-legacy-${{ runner.os }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-legacy-${{ runner.os }}-

      - name: Get dependencies
        run: go get -v ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
