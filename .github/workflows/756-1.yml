name: Test Caching for Go < 1.10

on:
  workflow_dispatch: 

jobs:
  test-legacy-go:
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/go
      
    steps:
      - name: Setup Go 1.9 (without built-in cache)
        uses: actions/setup-go@v6
        with:
          go-version: '1.9'
          cache: false

      - name: Verify Go version
        run: go version

      # Checkout into GOPATH structure
      - name: Checkout code into GOPATH
        uses: actions/checkout@v7
        with:
          path: go/src/github.com/${{ github.repository }}

      - name: Restore Go cache (GOPATH/pkg)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOPATH }}/pkg
          key: go-legacy-${{ runner.os }}-${{ hashFiles('go/src/github.com/${{ github.repository }}/**/*.go') }}
          restore-keys: |
            go-legacy-${{ runner.os }}-

      - name: Get dependencies
        working-directory: go/src/github.com/${{ github.repository }}
        run: go get -v -d ./...

      - name: Build
        working-directory: go/src/github.com/${{ github.repository }}
        run: go build -v ./...

      - name: Test
        working-directory: go/src/github.com/${{ github.repository }}
        run: go test -v ./...
